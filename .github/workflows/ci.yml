name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: poppler (pdftotext extractor) and tesseract (OCR evidence test)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: pandoc and jq (resume and letter rendering)
        run: sudo apt-get install -y pandoc jq
      - name: typst 0.15.1 (pinned by checksum)
        run: |
          curl -fsSL -o typst.tar.xz https://github.com/typst/typst/releases/download/v0.15.1/typst-aarch64-unknown-linux-musl.tar.xz
          echo "5aa8d74a3d906e60ea12a66ac2f37f8eef1b14cbad7182a745e393a10c23dcee  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz --strip-components=1 typst-aarch64-unknown-linux-musl/typst
          sudo install -m 0755 typst /usr/local/bin/typst
      - name: OpenResume layer (node and git come with the runner image; OpenResume is fetched at its pinned commit)
        run: node --version && sh tools/openresume/install.sh
      - run: uv sync --locked
      - run: uv run --locked pytest -q
